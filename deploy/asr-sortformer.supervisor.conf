; Warm Sortformer diarization service (isolated .venv-nemo), managed by supervisor.
; Install: copy to /etc/supervisor/conf.d/asr-sortformer.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start asr-sortformer
; Runs the long-lived service process directly (NOT start-sortformer.sh, which is a one-shot launcher
; for manual use). Answers on 127.0.0.1:5531. Enable speaker_mode="sortformer" once it's up.
[program:asr-sortformer]
command=/state/asr/.venv-nemo/bin/python /state/asr/backend/sortformer_service.py
directory=/state/asr
user=asr
environment=HOME="/state/asr-home",HF_HOME="/state/asr/data/hf",XDG_CACHE_HOME="/state/asr/data/cache",TMPDIR="/state/asr/data/nemo_tmp"
autostart=true
autorestart=true
startsecs=30
startretries=100
stdout_logfile=/state/asr/data/supervisor-sortformer.log
stderr_logfile=/state/asr/data/supervisor-sortformer.err.log
priority=998
