; Keep the warm Sortformer diarization service alive (isolated .venv-nemo).
; Install: copy to /etc/supervisor/conf.d/asr-sortformer.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start asr-sortformer
; start-sortformer.sh is idempotent (only starts the service if 127.0.0.1:5531 is down), so supervisor
; re-running it is safe. Enable speaker_mode="sortformer" (admin setting or SPEAKER_MODE env) once this
; service answers on :5531.
[program:asr-sortformer]
command=/bin/bash /state/asr/start-sortformer.sh
user=root
autostart=true
autorestart=true
startsecs=5
startretries=1000000
stdout_logfile=/state/asr/data/supervisor-sortformer.log
stderr_logfile=/state/asr/data/supervisor-sortformer.err.log
priority=998
