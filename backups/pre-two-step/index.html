<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASR Call Analytics</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e8ec; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#3ecf8e;
    --err:#ff6b6b; --radius:14px;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f5f6f8; --panel:#fff; --panel2:#f0f2f5; --line:#e2e5ea;
      --text:#1a1d24; --muted:#5b6472; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);padding:32px 16px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px;font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:20px}
  .drop{border:2px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;
    cursor:pointer;transition:.15s;color:var(--muted)}
  .drop:hover,.drop.over{border-color:var(--accent);color:var(--text);background:var(--panel2)}
  .drop strong{color:var(--text)}
  .or{text-align:center;color:var(--muted);margin:14px 0;font-size:13px}
  input[type=text],select{width:100%;padding:10px 12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .row>div{flex:1;min-width:120px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;
    font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;width:100%}
  button:disabled{opacity:.5;cursor:not-allowed}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .hidden{display:none}
  /* progress */
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .step{font-size:12px;padding:5px 10px;border-radius:20px;background:var(--panel2);
    color:var(--muted);border:1px solid var(--line)}
  .step.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .step.done{background:transparent;color:var(--accent2);border-color:var(--accent2)}
  .bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
  /* results */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
    padding:5px 12px;font-size:13px}
  .chip b{color:var(--muted);font-weight:500}
  .spk-stats{margin:8px 0 4px}
  .spk-stats .b{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:4px 0 10px}
  .spk-stats .b>i{display:block;height:100%}
  .turn{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .turn .ts{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
  .badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;align-self:flex-start}
  .turn .tx{flex:1}
  .err{color:var(--err)}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{width:auto;margin:0;padding:7px 14px;font-size:13px;background:var(--panel2);
    color:var(--text);border:1px solid var(--line)}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  pre.full{white-space:pre-wrap;background:var(--panel2);padding:14px;border-radius:10px;
    border:1px solid var(--line);font:14px/1.6 inherit;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>ASR Call Analytics</h1>
  <p class="sub">Upload a call recording or paste a URL → speaker-wise transcript. Runs locally.</p>

  <!-- INPUT -->
  <div class="card" id="inputCard">
    <div class="drop" id="drop">
      <strong>Click to choose a recording</strong> or drag &amp; drop<br>
      <span id="fileName">any audio/video format</span>
      <input type="file" id="file" class="hidden" accept="audio/*,video/*">
    </div>
    <div class="or">— or —</div>
    <div>
      <label>Audio URL (presigned / public S3 or any https link)</label>
      <input type="text" id="url" placeholder="https://bucket.s3.amazonaws.com/call.mp3?X-Amz-...">
    </div>
    <div class="row">
      <div>
        <label>Model</label>
        <select id="model">
          <option value="large-v3">large-v3 — best quality (GPU)</option>
          <option value="large-v3-turbo">large-v3-turbo — fast + accurate (GPU)</option>
          <option value="medium">medium</option>
          <option value="small">small — fastest, lower accuracy</option>
        </select>
      </div>
      <div>
        <label>Source language</label>
        <input type="text" id="language" placeholder="auto-detect (or ml, hi, en…)">
      </div>
      <div>
        <label>Speakers</label>
        <input type="text" id="speakers" placeholder="auto (or 2)">
      </div>
      <div>
        <label>Translate to</label>
        <input type="text" id="target" value="English" placeholder="none (or English, Hindi…)">
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;cursor:pointer">
      <input type="checkbox" id="analytics" checked style="width:auto">
      <span>Run AI summary &amp; QA analytics (slower — uses the local LLM)</span>
    </label>
    <button id="go">Transcribe &amp; Analyze</button>
    <div class="hint">First run of a model downloads it once (small ≈ seconds, large-v3 ≈ a few minutes).</div>
  </div>

  <!-- PROGRESS -->
  <div class="card hidden" id="progressCard">
    <div class="steps" id="steps"></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="hint" id="progressText">Queued…</div>
  </div>

  <!-- RESULTS -->
  <div class="card hidden" id="resultCard"></div>
</div>

<script>
const PALETTE = ["#5b8cff","#3ecf8e","#ff9f45","#c98bff","#ff6b9d","#4dd0e1"];
const $ = s => document.querySelector(s);
let pollTimer = null;

// file picker + drag/drop
const drop = $("#drop"), fileInput = $("#file");
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]){ $("#fileName").textContent = fileInput.files[0].name; $("#url").value=""; } };
["dragover","dragenter"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",ev=>{ if(ev.dataTransfer.files[0]){ fileInput.files=ev.dataTransfer.files; $("#fileName").textContent=ev.dataTransfer.files[0].name; $("#url").value=""; }});

$("#go").onclick = submit;

async function submit(){
  const fd = new FormData();
  const f = fileInput.files[0], url = $("#url").value.trim();
  if (!f && !url){ alert("Choose a file or paste a URL."); return; }
  if (f) fd.append("file", f);
  if (url) fd.append("url", url);
  fd.append("model", $("#model").value);
  fd.append("language", $("#language").value.trim());
  fd.append("speakers", $("#speakers").value.trim());
  fd.append("target_language", $("#target").value.trim());
  fd.append("analytics", $("#analytics").checked ? "true" : "false");

  $("#go").disabled = true;
  $("#resultCard").classList.add("hidden");
  showProgress("queued", null);

  let r;
  try { r = await fetch("/api/jobs", {method:"POST", body:fd}).then(x=>x.json()); }
  catch(e){ return fail("Could not reach server."); }
  if (r.id) poll(r.id); else fail(r.detail || "Failed to start job.");
}

const STAGE_ORDER = ["Ingesting","Preprocessing","Transcribing","Diarizing","Assembling","Translating","Summarizing","Analyzing","Done"];
const N_STEPS = 8;
function showProgress(status, stage, detail){
  $("#progressCard").classList.remove("hidden");
  const cur = STAGE_ORDER.indexOf(stage);
  $("#steps").innerHTML = STAGE_ORDER.slice(0,N_STEPS).map((s,i)=>{
    let cls = "step"; if (stage===s) cls+=" active"; else if (cur>i || status==="done") cls+=" done";
    return `<span class="${cls}">${s}</span>`;
  }).join("");
  const pct = status==="done" ? 100 : Math.max(6, (cur/N_STEPS)*100);
  $("#barFill").style.width = pct+"%";
  $("#progressText").textContent = status==="queued" ? "Queued…" :
    status==="done" ? "Done." : `${stage||"Working"}${detail?" — "+detail:""}…`;
}

function poll(id){
  clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    const j = await fetch("/api/jobs/"+id).then(x=>x.json());
    showProgress(j.status, j.stage, j.detail);
    if (j.status==="done"){ clearInterval(pollTimer); $("#go").disabled=false; render(j.result); }
    if (j.status==="error"){ clearInterval(pollTimer); fail(j.error); }
  }, 1500);
}

function fail(msg){
  clearInterval(pollTimer); $("#go").disabled=false;
  $("#progressText").innerHTML = `<span class="err">✗ ${escapeHtml(msg)}</span>`;
}

function colorFor(speaker, map){
  if (!(speaker in map)) map[speaker] = PALETTE[Object.keys(map).length % PALETTE.length];
  return map[speaker];
}

function roleOf(res, spk){
  const r = res.roles||{};
  if (r.agent===spk) return " (Agent)";
  if (r.customer===spk) return " (Customer)";
  return "";
}

function render(res){
  const map = {};
  const s = res.stats;
  const spkBars = Object.entries(s.per_speaker).map(([spk,v])=>{
    const c = colorFor(spk, map);
    return `<div><small style="color:var(--muted)">${spk}${roleOf(res,spk)} · ${fmt(v.talk_seconds)} (${v.talk_share_pct}%)</small>
      <div class="b"><i style="width:${v.talk_share_pct}%;background:${c}"></i></div></div>`;
  }).join("");

  const turns = res.turns.map(t=>{
    const c = colorFor(t.speaker, map);
    const tr = t.text_translated ? `<div style="color:var(--muted);margin-top:3px">↳ ${escapeHtml(t.text_translated)}</div>` : "";
    return `<div class="turn">
      <span class="ts">${fmt(t.start)}–${fmt(t.end)}</span>
      <span class="badge" style="background:${c}22;color:${c}">${escapeHtml(t.speaker)}${roleOf(res,t.speaker)}</span>
      <span class="tx">${escapeHtml(t.text)}${tr}</span>
    </div>`;
  }).join("");

  const qa = res.analytics||{}, sum = res.summary||{};
  const hasQA = qa.overall_score!=null || (sum && sum.summary);
  const scoreChip = qa.overall_score!=null
    ? `<span class="chip"><b>QA score</b> ${qa.overall_score}/100${qa.compliance_fail?" ⚠":""}</span>` : "";
  const tgtChip = res.target_language ? `<span class="chip"><b>translated</b> ${escapeHtml(res.target_language)}</span>` : "";

  $("#resultCard").innerHTML = `
    <div class="chips">
      <span class="chip"><b>file</b> ${escapeHtml(res.filename)}</span>
      <span class="chip"><b>language</b> ${res.language}</span>
      ${tgtChip}
      <span class="chip"><b>duration</b> ${fmt(res.duration_seconds)}</span>
      <span class="chip"><b>speakers</b> ${s.num_speakers}</span>
      ${scoreChip}
      <span class="chip"><b>processed in</b> ${fmt(res.elapsed_seconds)}</span>
    </div>
    <div class="spk-stats">${spkBars}</div>
    <div class="tabs">
      <button class="on" data-tab="turns">Speaker-wise</button>
      <button data-tab="full">Full text</button>
      ${sum && sum.summary ? '<button data-tab="summary">Summary</button>' : ''}
      ${qa.scorecard ? '<button data-tab="qa">QA analytics</button>' : ''}
    </div>
    <div class="tab" id="tabTurns">${turns || '<p class="hint">No speech detected.</p>'}</div>
    <div class="tab hidden" id="tabFull">
      <pre class="full">${escapeHtml(res.full_text)}</pre>
      ${res.full_text_translated ? `<p class="hint" style="margin-top:12px">Translated (${escapeHtml(res.target_language)}):</p><pre class="full">${escapeHtml(res.full_text_translated)}</pre>`:''}
    </div>
    <div class="tab hidden" id="tabSummary">${renderSummary(sum)}</div>
    <div class="tab hidden" id="tabQa">${renderQA(qa)}</div>`;

  $("#resultCard").classList.remove("hidden");
  const tabs = {turns:"#tabTurns", full:"#tabFull", summary:"#tabSummary", qa:"#tabQa"};
  $("#resultCard").querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
    $("#resultCard").querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    $("#resultCard").querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));
    $(tabs[b.dataset.tab]).classList.remove("hidden");
  });
}

function renderSummary(sum){
  if (!sum || !sum.summary) return '<p class="hint">No summary.</p>';
  const sent = sum.customer_sentiment||{};
  const list = (arr)=> (arr&&arr.length)? "<ul>"+arr.map(x=>`<li>${escapeHtml(x)}</li>`).join("")+"</ul>" : '<p class="hint">—</p>';
  return `
    <p>${escapeHtml(sum.summary)}</p>
    <div class="chips" style="margin:12px 0">
      <span class="chip"><b>outcome</b> ${escapeHtml(sum.outcome||"?")}</span>
      <span class="chip"><b>customer sentiment</b> ${escapeHtml(sent.overall||"?")}</span>
      <span class="chip"><b>agent tone</b> ${escapeHtml(sum.agent_tone||"?")}</span>
    </div>
    <h4>Key points</h4>${list(sum.key_points)}
    <h4>Action items</h4>${list(sum.action_items)}
    ${sent.frustration_points&&sent.frustration_points.length?`<h4>Frustration points</h4>${list(sent.frustration_points)}`:''}`;
}

function renderQA(qa){
  if (qa.error) return `<p class="err">Analytics failed: ${escapeHtml(qa.error)}</p>`;
  if (!qa.scorecard) return '<p class="hint">No analytics.</p>';
  const cats = {};
  qa.scorecard.forEach(r=>{ (cats[r.category]=cats[r.category]||[]).push(r); });
  const vColor = v => v==="Met"?"var(--accent2)": v==="Not Met"?"var(--err)": v==="N/A"?"var(--muted)":"var(--accent)";
  const body = Object.entries(cats).map(([cat,rows])=>`
    <h4 style="margin:16px 0 6px">${escapeHtml(cat)}</h4>
    ${rows.map(r=>`<div style="padding:8px 0;border-top:1px solid var(--line)">
      <div style="display:flex;gap:8px;align-items:center">
        <span class="badge" style="background:${vColor(r.verdict)}22;color:${vColor(r.verdict)}">${r.score>0?r.score+"/5":"N/A"}</span>
        <b>${escapeHtml(r.checkpoint)}</b>
        <span style="color:var(--muted);font-size:12px">${escapeHtml(r.verdict||"")}</span>
      </div>
      ${r.evidence?`<div style="font-size:13px;margin-top:3px">“${escapeHtml(r.evidence)}”</div>`:''}
      ${r.suggestion?`<div style="font-size:13px;color:var(--muted);margin-top:2px">→ ${escapeHtml(r.suggestion)}</div>`:''}
    </div>`).join("")}`).join("");
  return `<div class="chips" style="margin-bottom:8px">
      <span class="chip"><b>overall</b> ${qa.overall_score}/100</span>
      <span class="chip"><b>raw</b> ${qa.raw_score}/100</span>
      ${qa.compliance_fail?'<span class="chip" style="color:var(--err)"><b>⚠ compliance fail</b></span>':''}
    </div>${body}`;
}

function fmt(sec){ sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,"0")}`; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
</script>
</body>
</html>
